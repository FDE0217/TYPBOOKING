name: Build Android app

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm install -g @capacitor/assets
      - run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          cp icon-512.png assets/icon-foreground.png
          cp icon-512.png assets/icon-background.png
          cp icon-512.png assets/splash.png
          cp icon-512.png assets/splash-dark.png
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build release bundle (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: typ-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
